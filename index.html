<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Objection Handler</title>
    <style>
        /* Clean, minimal styling for the application */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }

        .section h2 {
            color: #34495e;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .recording {
            background: #e74c3c !important;
        }

        .recording:hover {
            background: #c0392b !important;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .display-area {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            min-height: 80px;
            font-size: 14px;
            line-height: 1.5;
        }

        .empty {
            color: #7f8c8d;
            font-style: italic;
        }

        .api-key-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .api-key-section input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-right: 10px;
            width: 300px;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #b3d7ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Live Objection Handler</h1>
        
        <!-- API Key Configuration Section -->
        <div class="api-key-section">
            <input type="password" id="apiKeyInput" placeholder="Enter your Google AI API Key">
            <button onclick="saveApiKey()">Save API Key</button>
            <div id="apiKeyStatus"></div>
        </div>

        <!-- Speech Recognition Controls -->
        <div class="section">
            <h2>🎤 Speech Recognition</h2>
            <button id="speechButton" onclick="toggleSpeechRecognition()">Start Listening</button>
            <div id="speechStatus" class="status info" style="display: none;">Ready to listen...</div>
        </div>

        <!-- Transcribed Speech Display -->
        <div class="section">
            <h2>📝 Transcribed Objection</h2>
            <div id="transcriptionDisplay" class="display-area empty">Spoken objection will appear here...</div>
            <button id="clearButton" onclick="clearTranscription()" style="margin-top: 10px;" disabled>Clear Transcription</button>
        </div>

        <!-- System Prompt Configuration -->
        <div class="section">
            <h2>⚙️ System Prompt (Instructions for AI)</h2>
            <textarea id="systemPrompt" placeholder="Enter instructions for how the AI should respond to objections...">You are a helpful sales assistant. When given an objection, provide a thoughtful, professional response that addresses the concern while maintaining a positive tone. Keep responses concise and actionable.</textarea>
        </div>

        <!-- AI Response Display -->
        <div class="section">
            <h2>🤖 AI Response</h2>
            <div id="aiResponse" class="display-area empty">AI-generated response will appear here...</div>
            <button id="generateButton" onclick="generateResponse()" style="margin-top: 10px;" disabled>Generate Response</button>
        </div>
    </div>

    <script>
        // Global variables to manage application state
        let recognition = null;
        let isListening = false;
        let currentTranscription = '';

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeSpeechRecognition();
            loadApiKey();
        });

        /**
         * Initialize the Web Speech API for speech recognition
         * Sets up event handlers and configuration
         */
        function initializeSpeechRecognition() {
            // Check if the browser supports speech recognition
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showStatus('speechStatus', 'Speech recognition not supported in this browser. Please use Chrome, Edge, or Safari.', 'error');
                document.getElementById('speechButton').disabled = true;
                return;
            }

            try {
                // Create speech recognition instance (webkit prefix for Chrome/Safari)
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();

                // Configure speech recognition settings
                recognition.continuous = true;        // Keep listening until manually stopped
                recognition.interimResults = true;   // Show results as user speaks
                recognition.lang = 'en-US';         // Set language to English
                recognition.maxAlternatives = 1;     // Only need the best result
            } catch (error) {
                console.error('Error initializing speech recognition:', error);
                showStatus('speechStatus', 'Failed to initialize speech recognition', 'error');
                document.getElementById('speechButton').disabled = true;
                return;
            }

            // Handle speech recognition results
            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = currentTranscription; // Start with existing final transcript

                // Process all speech recognition results
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Update the stored final transcription
                currentTranscription = finalTranscript;
                
                // Create display text with final transcript + interim (interim in different style)
                const displayDiv = document.getElementById('transcriptionDisplay');
                const fullText = finalTranscript + interimTranscript;
                
                if (fullText.trim()) {
                    // Create HTML with final text and interim text styled differently
                    if (interimTranscript) {
                        displayDiv.innerHTML = finalTranscript + '<span style="color: #7f8c8d; font-style: italic;">' + interimTranscript + '</span>';
                    } else {
                        displayDiv.textContent = finalTranscript;
                    }
                    displayDiv.classList.remove('empty');
                    
                    // Enable buttons based on transcript availability
                    document.getElementById('generateButton').disabled = !finalTranscript.trim();
                    document.getElementById('clearButton').disabled = !finalTranscript.trim();
                } else {
                    displayDiv.textContent = 'Spoken objection will appear here...';
                    displayDiv.classList.add('empty');
                    document.getElementById('generateButton').disabled = true;
                    document.getElementById('clearButton').disabled = true;
                }
            };

            // Handle speech recognition start
            recognition.onstart = function() {
                showStatus('speechStatus', 'Listening... Speak now!', 'info');
            };

            // Handle speech recognition end
            recognition.onend = function() {
                if (isListening) {
                    // Try to restart if we're still supposed to be listening
                    // This handles cases where recognition stops unexpectedly
                    try {
                        recognition.start();
                        showStatus('speechStatus', 'Listening... Speak now!', 'info');
                    } catch (error) {
                        console.error('Error restarting speech recognition:', error);
                        showStatus('speechStatus', 'Speech recognition stopped', 'info');
                        updateSpeechButton(false);
                    }
                } else {
                    showStatus('speechStatus', 'Speech recognition stopped', 'info');
                    updateSpeechButton(false);
                }
            };

            // Handle speech recognition errors
            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                
                let errorMessage = 'Speech recognition error';
                switch(event.error) {
                    case 'no-speech':
                        errorMessage = 'No speech detected. Please try again.';
                        break;
                    case 'audio-capture':
                        errorMessage = 'Microphone access denied or unavailable.';
                        break;
                    case 'not-allowed':
                        errorMessage = 'Microphone permission denied. Please allow microphone access.';
                        break;
                    case 'network':
                        errorMessage = 'Network error. Please check your connection.';
                        break;
                    case 'aborted':
                        errorMessage = 'Speech recognition was aborted.';
                        break;
                    case 'bad-grammar':
                        errorMessage = 'Speech recognition grammar error.';
                        break;
                    default:
                        errorMessage = `Speech recognition error: ${event.error}`;
                }
                
                showStatus('speechStatus', errorMessage, 'error');
                
                // Don't auto-restart for certain errors that require user intervention
                if (event.error === 'not-allowed' || event.error === 'audio-capture') {
                    updateSpeechButton(false);
                } else if (event.error === 'no-speech' && isListening) {
                    // For no-speech errors, just show the message but keep listening
                    // The recognition will automatically restart via onend handler
                } else {
                    updateSpeechButton(false);
                }
            };
        }

        /**
         * Toggle speech recognition on/off
         */
        function toggleSpeechRecognition() {
            if (!recognition) {
                showStatus('speechStatus', 'Speech recognition not available', 'error');
                return;
            }

            if (isListening) {
                // Stop listening
                recognition.stop();
                updateSpeechButton(false);
                showStatus('speechStatus', 'Stopped listening', 'info');
            } else {
                // Start listening
                try {
                    recognition.start();
                    updateSpeechButton(true);
                } catch (error) {
                    console.error('Error starting speech recognition:', error);
                    showStatus('speechStatus', 'Error starting speech recognition', 'error');
                }
            }
        }

        /**
         * Update the speech button appearance and state
         */
        function updateSpeechButton(listening) {
            isListening = listening;
            const button = document.getElementById('speechButton');
            
            if (listening) {
                button.textContent = 'Stop Listening';
                button.classList.add('recording');
            } else {
                button.textContent = 'Start Listening';
                button.classList.remove('recording');
            }
        }

        /**
         * Save the OpenAI API key to localStorage
         */
        function saveApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            
            if (!apiKey) {
                showStatus('apiKeyStatus', 'Please enter an API key', 'error');
                return;
            }

            // Basic API key validation for Google AI (check length and format)
            if (apiKey.length < 30 || !apiKey.startsWith('AIza')) {
                showStatus('apiKeyStatus', 'Invalid Google AI API key format', 'error');
                return;
            }

            // Save to localStorage
            localStorage.setItem('google_ai_api_key', apiKey);
            showStatus('apiKeyStatus', 'API key saved successfully!', 'success');
            
            // Clear the input field for security
            document.getElementById('apiKeyInput').value = '';
        }

        /**
         * Load the API key from localStorage on page load
         */
        function loadApiKey() {
            const savedKey = localStorage.getItem('google_ai_api_key');
            if (savedKey) {
                showStatus('apiKeyStatus', 'API key loaded from storage', 'success');
            } else {
                showStatus('apiKeyStatus', 'No API key found. Please enter your Google AI API key.', 'info');
            }
        }

        /**
         * Generate AI response using OpenAI API
         */
        /**
         * Sanitize text input to prevent potential issues
         */
        function sanitizeInput(input, maxLength = 2000) {
            if (!input || typeof input !== 'string') return '';
            
            // Trim whitespace and limit length
            let sanitized = input.trim().substring(0, maxLength);
            
            // Remove potentially problematic characters but keep basic punctuation
            sanitized = sanitized.replace(/[<>]/g, '');
            
            return sanitized;
        }

        async function generateResponse() {
            const apiKey = localStorage.getItem('google_ai_api_key');
            const rawSystemPrompt = document.getElementById('systemPrompt').value;
            const rawObjection = currentTranscription;

            // Sanitize and validate inputs
            const systemPrompt = sanitizeInput(rawSystemPrompt, 1000);
            const objection = sanitizeInput(rawObjection, 500);

            if (!apiKey) {
                showStatus('apiKeyStatus', 'Please save your Google AI API key first', 'error');
                return;
            }

            if (!objection) {
                alert('No objection transcribed. Please speak an objection first.');
                return;
            }

            if (systemPrompt.length === 0) {
                if (!confirm('No system prompt provided. Continue with default instructions?')) {
                    return;
                }
            }

            // Update UI to show loading state
            const responseDiv = document.getElementById('aiResponse');
            const generateBtn = document.getElementById('generateButton');
            
            responseDiv.textContent = 'Generating response...';
            responseDiv.classList.remove('empty');
            generateBtn.disabled = true;

            try {
                // Call Google AI (Gemini) API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: `${systemPrompt || 'You are a helpful sales assistant. Provide professional responses to objections.'}\n\nPlease respond to this objection: "${objection}"`
                                    }
                                ]
                            }
                        ],
                        generationConfig: {
                            maxOutputTokens: 300,
                            temperature: 0.7
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    let errorMessage = 'API request failed';
                    
                    console.log('API Error Details:', {
                        status: response.status,
                        statusText: response.statusText,
                        errorData: errorData
                    });
                    
                    switch(response.status) {
                        case 401:
                        case 403:
                            errorMessage = 'Invalid API key. Please verify your Google AI API key is correct and active.';
                            break;
                        case 429:
                            errorMessage = 'Rate limit exceeded. Please try again later.';
                            break;
                        case 400:
                            errorMessage = errorData.error?.message || 'Bad request. Please check your input.';
                            break;
                        case 500:
                        case 502:
                        case 503:
                            errorMessage = 'Google AI service temporarily unavailable. Please try again.';
                            break;
                        default:
                            errorMessage = errorData.error?.message || `API error: ${response.status} ${response.statusText}`;
                    }
                    
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                
                // Display the AI response
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    responseDiv.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error('Unexpected response format from Google AI API');
                }

            } catch (error) {
                console.error('Error generating response:', error);
                
                // Handle network errors separately
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    responseDiv.textContent = 'Network error. Please check your internet connection.';
                } else {
                    responseDiv.textContent = `Error: ${error.message}`;
                }
                responseDiv.classList.add('empty');
            } finally {
                generateBtn.disabled = false;
            }
        }

        /**
         * Clear the current transcription
         */
        function clearTranscription() {
            currentTranscription = '';
            const displayDiv = document.getElementById('transcriptionDisplay');
            displayDiv.textContent = 'Spoken objection will appear here...';
            displayDiv.classList.add('empty');
            
            // Clear AI response as well
            const responseDiv = document.getElementById('aiResponse');
            responseDiv.textContent = 'AI-generated response will appear here...';
            responseDiv.classList.add('empty');
            
            // Disable buttons
            document.getElementById('generateButton').disabled = true;
            document.getElementById('clearButton').disabled = true;
        }

        /**
         * Show status messages to the user
         */
        function showStatus(elementId, message, type) {
            const statusElement = document.getElementById(elementId);
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
            statusElement.style.display = 'block';

            // Auto-hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
